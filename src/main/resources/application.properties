spring.config.import=file:.env[.properties]
spring.application.name=hackathon_team3_BE

# Prototype defaults. Replace these with each store's real operating hours later.
appointment.slot-minutes=30
appointment.opening-time=10:30
appointment.closing-time=20:30

server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:resense;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.mvc.async.request-timeout=0
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

resense.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
resense.speech.api-url=${SPEECH_API_URL:}
resense.speech.api-key=${SPEECH_API_KEY:}
resense.speech.model=${SPEECH_MODEL:gpt-4o-mini-transcribe}
resense.intent.api-url=${AI_INTENT_API_URL:}
resense.intent.api-key=${AI_INTENT_API_KEY:}
resense.intent.model=${AI_INTENT_MODEL:gpt-4o-mini}
resense.intent.max-attempts=${AI_INTENT_MAX_ATTEMPTS:2}
resense.image.api-url=${IMAGE_API_URL:}
resense.image.api-key=${IMAGE_API_KEY:}
resense.image.model=${IMAGE_MODEL:gpt-image-2}
resense.image.max-attempts=${IMAGE_MAX_ATTEMPTS:2}
